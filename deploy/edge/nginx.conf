worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 32m;

  upstream warroom_gateway { server 127.0.0.1:8520; }
  upstream metabase { server 127.0.0.1:3001; }
  # Main War Room Streamlit (no baseUrlPath) — used for office entry
  upstream warroom_ui { server 127.0.0.1:8502; }
  # Public path Streamlit (baseUrlPath=/warroom)
  upstream warroom_ui_public { server 127.0.0.1:8530; }

  # -------------------------------------------------------------------------
  # OFFICE / Private Wi-Fi entry — no login, no Metabase, no tokens in URL
  # Simple link for business owner: http://192.168.2.95:8080/
  # -------------------------------------------------------------------------
  server {
    listen 192.168.2.95:8080;
    server_name _;

    allow 192.168.2.0/24;
    allow 10.100.0.0/24;
    allow 127.0.0.1;
    deny all;

    location / {
      proxy_pass http://warroom_ui/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }
  }

  # -------------------------------------------------------------------------
  # PUBLIC edge :3000 — Metabase on /, War Room on /warroom/ (no Metabase login)
  # -------------------------------------------------------------------------
  server {
    listen 3000;
    server_name _;

    # Exact path without slash → trailing slash (keeps users on Streamlit)
    location = /warroom {
      return 301 /warroom/;
    }

    location /warroom/ {
      proxy_pass http://warroom_ui_public/warroom/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }

    location /warroom-api/ {
      proxy_pass http://warroom_gateway/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-WarRoom-Token $http_x_warroom_token;
      proxy_read_timeout 120s;
      proxy_connect_timeout 10s;
    }

    location / {
      proxy_pass http://metabase;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
    }
  }
}
