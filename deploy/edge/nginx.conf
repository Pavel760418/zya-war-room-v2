worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 32m;

  # War Room SQL gateway (Streamlit Cloud → here → MSSQL on LAN)
  upstream warroom_gateway { server 127.0.0.1:8520; }
  # Metabase kept on same public port via path /
  upstream metabase { server 127.0.0.1:3001; }

  server {
    listen 3000;
    server_name _;

    location /warroom-api/ {
      proxy_pass http://warroom_gateway/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-WarRoom-Token $http_x_warroom_token;
      proxy_read_timeout 120s;
      proxy_connect_timeout 10s;
    }

    location / {
      proxy_pass http://metabase;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
    }
  }
}
