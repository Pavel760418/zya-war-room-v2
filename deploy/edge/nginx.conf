worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 32m;

  upstream warroom_gateway { server 127.0.0.1:8520; }
  upstream metabase { server 127.0.0.1:3001; }
  # Main War Room Streamlit — office entry :8080 → systemd unit warroom-streamlit (:8501)
  upstream warroom_ui { server 127.0.0.1:8501; }
  # Public path Streamlit (baseUrlPath=/warroom)
  upstream warroom_ui_public { server 127.0.0.1:8530; }

  # -------------------------------------------------------------------------
  # OFFICE / Private Wi-Fi entry — no login, no Metabase, no tokens in URL
  # Simple link for business owner: http://192.168.2.95:8080/
  # -------------------------------------------------------------------------
  server {
    listen 192.168.2.95:8080;
    listen 192.168.2.95:80;
    server_name _;

    # Office LAN + corporate Wi‑Fi (Private): no login. Same URL for everyone.
    allow 192.168.2.0/24;
    allow 10.100.0.0/23;
    allow 10.100.0.132;
    allow 10.15.0.0/24;
    allow 10.15.0.29;
    allow 127.0.0.1;
    deny all;

    # Excel/docs exports for office download
    location /exports/ {
      alias /var/www/warroom-exports/;
      default_type application/octet-stream;
      add_header Content-Disposition "attachment";
      add_header Cache-Control "no-store";
      try_files $uri =404;
    }

    location / {
      proxy_pass http://warroom_ui/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }
  }

  # -------------------------------------------------------------------------
  # PUBLIC edge :3000 — МегаМетрики на / (смартфон / внешняя сеть).
  # Metabase уезжает на /metabase/, иначе Safari с /warroom/ падает в логин.
  # -------------------------------------------------------------------------
  server {
    listen 3000;
    server_name _;

    location = /warroom { return 301 /mega/; }
    location = /warroom/ { return 301 /mega/; }
    location /warroom/ { return 301 /mega/; }
    location = /m { return 301 /mega/; }
    location = /megametriki { return 301 /mega/; }

    location = /auth/login {
      add_header Clear-Site-Data "\"cache\",\"cookies\",\"storage\"";
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      default_type text/html;
      return 200 '<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/></head><body style="font-family:system-ui;background:#0b100f;color:#edf4ef;padding:24px"><p>Открываем МегаМетрики…</p><script>(async()=>{try{if(navigator.serviceWorker){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if(window.caches){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}}catch(e){}location.replace("/mega/?t="+Date.now())})()</script></body></html>';
    }
    location = /auth/login/ { return 302 /mega/; }
    location = / {
      add_header Clear-Site-Data "\"cache\",\"cookies\",\"storage\"";
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      default_type text/html;
      return 200 '<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/></head><body style="font-family:system-ui;background:#0b100f;color:#edf4ef;padding:24px"><p>Открываем МегаМетрики…</p><script>(async()=>{try{if(navigator.serviceWorker){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if(window.caches){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}}catch(e){}location.replace("/mega/?t="+Date.now())})()</script></body></html>';
    }
    location = /sw.js {
      add_header Cache-Control "no-store";
      default_type application/javascript;
      return 200 'self.addEventListener("install",e=>self.skipWaiting());self.addEventListener("activate",e=>{e.waitUntil((async()=>{try{const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}catch(err){}await self.registration.unregister();const cs=await self.clients.matchAll({type:"window"});cs.forEach(c=>c.navigate("/mega/?t="+Date.now()))})())});';
    }
    location = /service-worker.js {
      add_header Cache-Control "no-store";
      default_type application/javascript;
      return 200 'self.addEventListener("install",e=>self.skipWaiting());self.addEventListener("activate",e=>{e.waitUntil((async()=>{try{const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}catch(err){}await self.registration.unregister();const cs=await self.clients.matchAll({type:"window"});cs.forEach(c=>c.navigate("/mega/?t="+Date.now()))})())});';
    }

    location /mega/ {
      proxy_pass http://warroom_ui/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }

    location /warroom-api/ {
      proxy_pass http://warroom_gateway/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-WarRoom-Token $http_x_warroom_token;
      proxy_read_timeout 120s;
      proxy_connect_timeout 10s;
    }

    location /metabase/ {
      proxy_pass http://metabase/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://warroom_ui;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }
  }
}
