# Optional local MSSQL for smoke tests when production 1C is unreachable.
# Usage:
#   docker compose -f docker-compose.mssql.yml up -d
#   # wait ~30s for health, then:
#   export DATABASE_URL='mssql+pymssql://sa:Your_strong_Passw0rd@127.0.0.1:14333/master'
#
# Production War Room uses the live 1C DB (see README Production checklist).
# This compose file only proves the SQL driver + settings path end-to-end.

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: warroom-mssql-test
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd"
    ports:
      - "14333:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_strong_Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
